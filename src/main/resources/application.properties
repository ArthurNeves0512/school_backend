spring.application.name=school-api
# datasource PostgreSQL
spring.datasource.url = jdbc:postgresql://0.0.0.0:5432/school?currentSchema=school
spring.datasource.username=arthur
spring.datasource.password=123

# jpa
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Aqui basicamente a gente vai habilitar pro Spring atualizar o banco com base nas entidades q ele ve
#spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.show_sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.mvc.static-path-pattern=/static/**

spring.flyway.baselineOnMigrate = true
#flyway.enabled = true
spring.flyway.default-schema=school
spring.flyway.create-schemas=true

