version: '3'
services:
  database:
    image: postgres
    container_name: school_database
    restart: always
    ports:
    - 5432:5432
    environment:
        POSTGRES_PASSWORD: 123
        POSTGRES_DB: school
        POSTGRES_USER: arthur

  adminer:
    container_name: adminer
    image: adminer
    restart: always
    ports:
      - 8000:8080
